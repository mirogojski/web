<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Mirogoj">
  <title>Mirogoj</title>
  <style>
    .mark { fill: none; stroke: #223F99; stroke-width: 6; stroke-linecap: round }
    @media (prefers-color-scheme: dark) { .mark { stroke: #ffffff } }
  </style>
  <!-- Central cupola of the Mirogoj arcades -->
  <path class="mark" d="M 42 62 A 18 18 0 0 1 78 62" />
  <!-- Lantern above the cupola -->
  <path class="mark" d="M 60 44 V 32" />
  <!-- Flanking arcade arches -->
  <path class="mark" d="M 18 74 A 11 11 0 0 1 40 74" />
  <path class="mark" d="M 80 74 A 11 11 0 0 1 102 74" />
  <!-- Ground line of the colonnade -->
  <path class="mark" d="M 14 96 H 106" />
</svg>
